[package]
name = "abs-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
abs-core.workspace = true
abs-player.workspace = true
abs-reader-ipc.workspace = true
anyhow = "1.0.104"
fontdb = "0.24"
image = { version = "0.25.9", default-features = false, features = ["webp", "jpeg", "png"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde_json = "1.0.154"
slint = { version = "1.18", features = ["raw-window-handle-06"] }

[features]
## Updates through Velopack. Only the Windows installer and its portable zip turn this on;
## package-manager builds update through their own channel.
self-update = ["dep:velopack"]

[target.'cfg(windows)'.dependencies]
velopack = { version = "1.2.161", optional = true }
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm"] }

[build-dependencies]
serde_json = "1.0.154"
slint-build = "1.18"
winresource = "0.1.34"

[dev-dependencies]
libmpv2 = "6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
