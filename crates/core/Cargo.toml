[package]
name = "abs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
integration = []

[dependencies]
abs-api.workspace = true
keyring-core = "1.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
