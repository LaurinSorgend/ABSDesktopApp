[package]
name = "abs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
integration = []

[dependencies]
abs-api.workspace = true
fs4 = { version = "1.1.0", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.24"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
uuid = { version = "1.26.1", features = ["v4"] }
lofty = "0.25.5"
mp4ameta = "0.13.0"
id3 = "1.17.2"
regex = "1"
roxmltree = "0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
