[package]
name = "abs-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
integration = []

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1.0.104"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
