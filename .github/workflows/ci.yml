name: CI

on:
  push:
    branches: [main, "release/**", "hotfix/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The themes repository is private; the token needs read access to it.
  ABS_THEMES_DIR: ${{ github.workspace }}/abs-desktop-themes
  LINUX_LIBS: libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev libfontconfig1-dev libxkbcommon-dev

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out the themes
        uses: actions/checkout@v4
        with:
          repository: LaurinSorgend/abs-desktop-themes
          token: ${{ secrets.THEMES_TOKEN }}
          path: abs-desktop-themes
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_LIBS
      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    env:
      ABS_TEST_SERVERS: http://localhost:13378,http://localhost:13379
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out the themes
        uses: actions/checkout@v4
        with:
          repository: LaurinSorgend/abs-desktop-themes
          token: ${{ secrets.THEMES_TOKEN }}
          path: abs-desktop-themes
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_LIBS ffmpeg
      - name: Cache test media
        uses: actions/cache@v4
        with:
          path: fixtures/media
          key: fixtures-${{ hashFiles('fixtures/fetch_fixtures.py') }}
      - name: Fetch test media
        run: python3 fixtures/fetch_fixtures.py
      - name: Start test servers
        run: docker compose -f docker/docker-compose.yml up -d --wait
      - name: Initialise test servers
        run: |
          python3 docker/init_server.py http://localhost:13378
          python3 docker/init_server.py http://localhost:13379
      - name: Integration tests
        run: cargo test --workspace --features abs-api/integration,abs-core/integration,abs-player/integration
      - name: Server logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 200
